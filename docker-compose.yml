services:
  postgres:
    image: postgres:17-alpine
    container_name: 123vendas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: 123vendas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 123vendas-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      JWT_SECRETKEY: "dR8!v9Kp@zL3xWq#N5gT7mYb$FcJ2sV0"
      POSTGRES_CONNECTION_STRING: "Host=postgres;Port=5432;Database=vendas;Username=postgres;Password=postgres"
      RABBITMQ_HOSTNAME: "rabbitmq"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_VIRTUALHOST: "/"
      RABBITMQ_PASSWORD: "guest"
      SEED_DATABASE_FLAG: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
